name: Docker Agent Image

on:
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: forwardx-agent-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/forwardx-agent
  UPSTREAM_REPOSITORY: poouo/Forwardx

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.upstream.outputs.should_build }}
      version: ${{ steps.upstream.outputs.version }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve latest upstream Agent release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest")"
          version="$(jq -r '.tag_name // empty' <<<"${release_json}")"
          if [[ ! "${version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest upstream release has an unsupported tag: ${version:-<empty>}"
            exit 1
          fi

          required_assets=(
            forwardx-agent-linux-amd64
            forwardx-agent-linux-arm64
            forwardx-fxp-linux-amd64
            forwardx-fxp-linux-arm64
            forwardx-runtime-linux-amd64
            forwardx-runtime-linux-arm64
            SHA256SUMS
          )
          for asset in "${required_assets[@]}"; do
            if ! jq -e --arg asset "${asset}" '.assets[] | select(.name == $asset)' <<<"${release_json}" >/dev/null; then
              echo "::error::Upstream release ${version} is missing ${asset}"
              exit 1
            fi
          done

          should_build=true
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]] && docker buildx imagetools inspect "${IMAGE_NAME}:${version}" >/dev/null 2>&1; then
            should_build=false
            echo "Image ${IMAGE_NAME}:${version} already exists; scheduled build is skipped."
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${should_build}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify upstream binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          mkdir -p agent-image-assets
          gh release download "${VERSION}" \
            --repo "${UPSTREAM_REPOSITORY}" \
            --dir agent-image-assets \
            --pattern "forwardx-agent-linux-${ARCH}" \
            --pattern "forwardx-fxp-linux-${ARCH}" \
            --pattern "forwardx-runtime-linux-${ARCH}" \
            --pattern SHA256SUMS

          cd agent-image-assets
          grep -E " (forwardx-agent|forwardx-fxp|forwardx-runtime)-linux-${ARCH}$" SHA256SUMS | sha256sum -c -
          chmod 0755 "forwardx-agent-linux-${ARCH}" "forwardx-fxp-linux-${ARCH}" "forwardx-runtime-linux-${ARCH}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            FORWARDX_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=ForwardX Agent
            org.opencontainers.image.description=ForwardX managed-host agent
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.forwardx.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=forwardx-agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=forwardx-agent-${{ matrix.arch }}

      - name: Verify Agent executable
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}@${DIGEST}"
          docker run --rm --platform "${PLATFORM}" \
            --entrypoint /usr/local/bin/forwardx-agent \
            "${IMAGE_NAME}@${DIGEST}" -h >/dev/null

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: forwardx-agent-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: forwardx-agent-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Publish and verify multi-platform image
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f | sort)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "::error::Expected 2 platform digests, found ${#digest_files[@]}"
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done

          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            "${sources[@]}"

          manifest_json="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" --raw)"
          echo "${manifest_json}" | jq -e '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1
            and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1
          '

          version_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" | awk '$1 == "Digest:" { digest=$2 } END { print digest }')"
          latest_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" | awk '$1 == "Digest:" { digest=$2 } END { print digest }')"
          test -n "${version_digest}"
          test "${version_digest}" = "${latest_digest}"
          echo "Published ${IMAGE_NAME}:${VERSION} and latest at ${version_digest}"
